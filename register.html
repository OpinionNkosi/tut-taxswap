<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account — TUT TextSwap</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="topnav">
  <div class="container">
    <div class="brand">TUT TextSwap<span class="dot">.</span></div>
    <div class="navlinks">
      <a href="index.html">Home</a>
      <a href="browse.html">Browse</a>
      <a href="sell.html">Sell an item</a>
      <span id="nav-user"></span>
    </div>
  </div>
</nav>

<section>
  <div class="container">
    <h1 style="text-align:center;">Create your TUT TextSwap account</h1>
    <p style="text-align:center; color:var(--muted); margin-bottom:28px;">Only TUT students can join — verify with your @tut4life.ac.za email.</p>

    <form id="register-form" class="form-card">
      <label for="name">Full name</label>
      <input id="name" type="text" required placeholder="e.g. Thabo Mokoena">

      <label for="email">TUT student email</label>
      <input id="email" type="email" required placeholder="yourname@tut4life.ac.za">
      <div class="help-text">Must end in @tut4life.ac.za — this is how we keep the platform TUT-only.</div>

      <label for="campus">Campus</label>
      <select id="campus" required>
        <option value="Pretoria">Pretoria</option>
        <option value="Soshanguve">Soshanguve</option>
        <option value="Ga-Rankuwa">Ga-Rankuwa</option>
        <option value="Mbombela">Mbombela</option>
        <option value="eMalahleni">eMalahleni</option>
      </select>

      <label for="password">Password</label>
      <input id="password" type="password" required minlength="6" placeholder="At least 6 characters">

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:20px;">Create account</button>
      <div id="form-msg" class="form-msg"></div>
    </form>

    <p style="text-align:center; margin-top:16px; color:var(--muted);">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</section>

<footer>
  <div class="container">TUT TextSwap — Phase 1 prototype</div>
</footer>

<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById("register-form").addEventListener("submit", function (e) {
  e.preventDefault();
  const msg = document.getElementById("form-msg");
  const result = DB.register({
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    campus: document.getElementById("campus").value,
    password: document.getElementById("password").value
  });
  if (result.ok) {
    msg.textContent = "Account created! Redirecting to login…";
    msg.className = "form-msg show success";
    setTimeout(() => window.location.href = "login.html", 1200);
  } else {
    msg.textContent = result.error;
    msg.className = "form-msg show error";
  }
});
</script>
</body>
</html>
